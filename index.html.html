<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>두더지 잡기</title>

<style>
*{
    box-sizing:border-box
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#87ceeb,#b8e986);
    font-family:Arial,"Malgun Gothic",sans-serif;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
    touch-action:manipulation
}

.game{
    width:500px;
    max-width:95vw;
    padding:25px;
    background:#fff;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px #0003
}

h1{
    margin:0 0 15px;
    color:#5a3d2b
}

.stats{
    display:flex;
    justify-content:space-around;
    margin-bottom:15px
}

.stat{
    font-weight:bold
}

.time{
    color:#e74c3c
}

.score{
    color:#2980b9
}

.combo{
    color:#e67e22
}

.board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px
}

.hole{
    position:relative;
    height:120px;
    overflow:hidden;
    border-radius:50%;
    background:#5c4033;
    box-shadow:inset 0 8px 12px #0006;
    cursor:pointer;
    touch-action:manipulation
}

.hole:after{
    content:"";
    position:absolute;
    left:10%;
    right:10%;
    bottom:5px;
    height:20px;
    background:#302018;
    border-radius:50%;
    z-index:4;
    pointer-events:none
}


/* 동물 */

.animal{
    position:absolute;
    width:80px;
    height:90px;
    left:50%;
    bottom:-110px;
    transform:translateX(-50%);
    transition:.15s;
    border-radius:45% 45% 40% 40%;
    z-index:2
}

.animal.active{
    bottom:5px
}

.eye{
    position:absolute;
    top:28px;
    width:9px;
    height:10px;
    background:#222;
    border-radius:50%;
    z-index:4
}

.eye.left{
    left:21px
}

.eye.right{
    right:21px
}

.nose{
    position:absolute;
    top:44px;
    left:50%;
    transform:translateX(-50%);
    width:13px;
    height:9px;
    background:#222;
    border-radius:50%;
    z-index:4
}


/* 두더지 */

.mole{
    background:#8b5a3c;
    border:3px solid #65402d;
    border-radius:45% 45% 35% 35%
}

.mole .ear{
    display:none
}

.mole .eye{
    top:29px;
    width:9px;
    height:9px
}

.mole .nose{
    top:45px;
    width:14px;
    height:10px;
    background:#e88d9d
}


/* 토끼 */

.rabbit{
    background:#f1dddd;
    border:3px solid #d2b5b5;
    border-radius:45% 45% 35% 35%
}

.rabbit .ear{
    position:absolute;
    width:16px;
    height:30px;
    top:-7px;
    background:#f1dddd;
    border:3px solid #d2b5b5;
    border-radius:50%;
    z-index:1
}

.rabbit .ear.left{
    left:12px;
    transform:rotate(-8deg)
}

.rabbit .ear.right{
    right:12px;
    transform:rotate(8deg)
}

.rabbit .ear:after{
    content:"";
    position:absolute;
    width:6px;
    height:19px;
    top:4px;
    left:2px;
    background:#e8a8b8;
    border-radius:50%
}

.rabbit .nose{
    background:#d87f98
}

.rabbit:after{
    content:"";
    position:absolute;
    left:50%;
    top:52px;
    transform:translateX(-50%);
    width:20px;
    height:13px;
    background:
        linear-gradient(
            to right,
            white 0,
            white 8px,
            transparent 8px,
            transparent 12px,
            white 12px,
            white 20px
        );
    border-radius:0 0 4px 4px;
    z-index:3
}


/* 호랑이 */

.tiger{
    background:#e9a13b;
    border:3px solid #c47b22;
    border-radius:45% 45% 35% 35%
}

.tiger .ear{
    position:absolute;
    width:18px;
    height:18px;
    top:2px;
    background:#e9a13b;
    border:3px solid #c47b22;
    border-radius:50%;
    z-index:1
}

.tiger .ear.left{
    left:9px
}

.tiger .ear.right{
    right:9px
}

.tiger .ear:after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    left:3px;
    top:3px;
    background:#f4c47a;
    border-radius:50%
}

.tiger:before{
    content:"";
    position:absolute;
    left:12px;
    top:25px;
    width:9px;
    height:14px;
    border-left:3px solid #70451f;
    border-radius:50%;
    transform:rotate(-20deg);
    box-shadow:47px 0 0 -1px #70451f
}

.tiger:after{
    content:"";
    position:absolute;
    left:50%;
    top:52px;
    transform:translateX(-50%);
    width:13px;
    height:8px;
    background:#8b5a3c;
    border-radius:50%;
    z-index:3
}

.tiger .eye{
    width:9px;
    height:9px;
    top:29px;
    background:#3d2a1c
}

.tiger .nose{
    top:44px;
    width:11px;
    height:8px;
    background:#8b5a3c
}


/* 점수 팝업 */

.pop{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:22px;
    font-weight:bold;
    color:#2ecc71;
    animation:pop .6s forwards;
    z-index:5;
    pointer-events:none
}

.pop.bad{
    color:#e74c3c
}

@keyframes pop{
    to{
        opacity:0;
        transform:translate(-50%,-40px)
    }
}


/* 버튼 */

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#6c5ce7;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent
}

button:hover{
    background:#5849d6;
    transform:translateY(-1px)
}

button:active{
    transform:scale(.98)
}


/* 시작 / 결과 화면 */

.overlay{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#87ceeb,#b8e986);
    z-index:100;
    padding:20px
}

.modal{
    width:400px;
    max-width:90vw;
    padding:30px;
    background:#fff;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 40px #0004
}

.modal h2{
    margin:0 0 20px;
    color:#222;
    font-size:28px
}

.rules{
    padding:16px 20px;
    margin:15px 0 20px;
    background:#f6f7f9;
    border-radius:10px;
    line-height:1.9;
    text-align:left;
    color:#333
}

.result{
    font-size:45px;
    font-weight:bold;
    color:#2980b9;
    margin:20px
}

.hidden{
    display:none
}


/* 모바일 */

@media (max-width:600px){

    body{
        min-height:100dvh;
        padding:10px
    }

    .game{
        width:100%;
        max-width:500px;
        padding:18px;
        border-radius:16px
    }

    h1{
        font-size:25px;
        margin-bottom:12px
    }

    .stats{
        margin-bottom:12px;
        font-size:14px
    }

    .board{
        gap:10px;
        margin-bottom:15px
    }

    .hole{
        height:100px
    }

    .animal{
        width:68px;
        height:78px;
        bottom:-95px
    }

    .animal.active{
        bottom:4px
    }

    .eye{
        top:24px;
        width:8px;
        height:9px
    }

    .eye.left{
        left:18px
    }

    .eye.right{
        right:18px
    }

    .nose{
        top:39px;
        width:12px;
        height:8px
    }

    .mole .eye{
        top:25px
    }

    .mole .nose{
        top:40px;
        width:13px;
        height:9px
    }

    .rabbit .ear{
        width:14px;
        height:27px
    }

    .rabbit .ear.left{
        left:10px
    }

    .rabbit .ear.right{
        right:10px
    }

    .rabbit:after{
        top:46px;
        width:18px;
        height:12px
    }

    .tiger .ear{
        width:16px;
        height:16px
    }

    .tiger .ear.left{
        left:8px
    }

    .tiger .ear.right{
        right:8px
    }

    .tiger:before{
        left:10px;
        top:22px;
        box-shadow:40px 0 0 -1px #70451f
    }

    .tiger:after{
        top:46px
    }

    .tiger .eye{
        top:25px
    }

    .tiger .nose{
        top:39px
    }

    button{
        padding:13px;
        font-size:17px
    }

    .modal{
        padding:24px 20px;
        border-radius:16px
    }

    .modal h2{
        font-size:24px;
        margin-bottom:15px
    }

    .rules{
        padding:13px 15px;
        margin:12px 0 16px;
        font-size:14px;
        line-height:1.8
    }

    .result{
        font-size:38px;
        margin:15px
    }
}


/* 아주 작은 화면 */

@media (max-width:380px){

    .game{
        padding:14px
    }

    h1{
        font-size:22px
    }

    .stats{
        font-size:13px
    }

    .board{
        gap:7px
    }

    .hole{
        height:85px
    }

    .animal{
        width:60px;
        height:70px;
        bottom:-85px
    }

    .animal.active{
        bottom:3px
    }
}
</style>

</head>

<body>

<!-- 시작 화면 -->

<div class="overlay" id="start">

<div class="modal">

    <h2>🐹 두더지 잡기</h2>

    <div class="rules">
        ⏱ 게임 시간 : <b>20초</b><br>
        🐹 두더지 : <b>+100점</b><br>
        🔥 콤보 성공 시 추가 점수<br>
        🐰 토끼 : <b>-100점</b><br>
        🐯 호랑이 : <b>-150점</b><br>
        ⚠️ 다른 동물을 클릭하면 콤보 초기화
    </div>

    <button onclick="startGame()">게임 시작</button>

</div>

</div>


<!-- 게임 화면 -->

<div class="game" id="gameScreen">

<h1>🐹 두더지 잡기</h1>

<div class="stats">

<div class="stat time">
    ⏱ <span id="time">20</span>초
</div>

<div class="stat score">
    점수 <span id="score">0</span>
</div>

<div class="stat combo">
    콤보 <span id="combo">0</span>
</div>

</div>

<div class="board" id="board"></div>

</div>


<!-- 결과 화면 -->

<div class="overlay hidden" id="result">

<div class="modal">

    <h2>🎉 게임 종료!</h2>

    <div class="result" id="finalScore">0</div>

    <div>
        잡은 두더지 : <b id="hits">0</b>마리<br>
        최대 콤보 : <b id="maxCombo">0</b><br>
        최고 점수 : <b id="best">0</b>
    </div>

    <br>

    <!-- 게임 중에는 숨겨져 있고 게임 종료 후 표시 -->
    <button id="retryButton" style="display:none">다시 하기</button>

</div>

</div>

<script>

const GAME_TIME=20;
const BAD_PROB=.25;

/* 총 게임 횟수 */
const MAX_GAME_COUNT=3;

/* 현재 플레이한 게임 횟수 */
let gameCount=0;

const board=document.getElementById("board");
const timeEl=document.getElementById("time");
const scoreEl=document.getElementById("score");
const comboEl=document.getElementById("combo");

let score=0;
let combo=0;
let maxCombo=0;
let hits=0;
let time=GAME_TIME;

let current=-1;
let running=false;

let timer;
let animalTimer;

let best=Number(localStorage.getItem("whackAMoleBest"))||0;

document.getElementById("best").textContent=best;


/* 9개 구멍 생성 */

for(let i=0;i<9;i++){

    const hole=document.createElement("div");

    hole.className="hole";

    ["mole","rabbit","tiger"].forEach(type=>{

        hole.innerHTML+=`
            <div class="animal ${type}">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="nose"></div>
            </div>
        `;

    });

    /* 모바일 터치 및 PC 클릭 모두 지원 */
    hole.addEventListener("click",()=>hit(i));

    board.appendChild(hole);
}

const holes=document.querySelectorAll(".hole");


/* 게임 시작 */

function startGame(){

    /* 총 3판까지만 허용 */
    if(gameCount>=MAX_GAME_COUNT){
        return;
    }

    gameCount++;

    clearInterval(timer);
    clearTimeout(animalTimer);

    score=0;
    combo=0;
    maxCombo=0;
    hits=0;
    time=GAME_TIME;

    current=-1;
    running=true;

    timeEl.textContent=time;
    scoreEl.textContent=score;
    comboEl.textContent=combo;

    /*
     * 시작 화면 숨기기
     * 결과 화면도 숨기기
     */
    document.getElementById("start").classList.add("hidden");
    document.getElementById("result").classList.add("hidden");

    /*
     * 게임 시작 시 결과 화면의
     * 다시 하기 버튼은 숨김
     */
    document.getElementById("retryButton").style.display="none";

    hide();

    timer=setInterval(()=>{

        timeEl.textContent=--time;

        if(time<=0){
            endGame();
        }

    },1000);

    next();
}


/* 모든 동물 숨기기 */

function hide(){

    document
        .querySelectorAll(".animal")
        .forEach(a=>a.classList.remove("active"));

}


/* 다음 동물 등장 */

function next(){

    if(!running)return;

    hide();

    let index;

    do{
        index=Math.floor(Math.random()*9);
    }while(index===current);

    current=index;

    const type=Math.random()<BAD_PROB
        ?(Math.random()<.5?"rabbit":"tiger")
        :"mole";

    const animal=holes[index].querySelector("."+type);

    animal.classList.add("active");


    /*
     * 등장 속도
     *
     * 시작 : 1100ms
     * 중간 : 약 900ms
     * 종료 : 700ms
     *
     * 모바일에서도 클릭하기 편하도록 조정
     */
    const speed=1100-400*(1-time/GAME_TIME);

    clearTimeout(animalTimer);

    animalTimer=setTimeout(()=>{

        animal.classList.remove("active");

        /* 놓쳐도 콤보 유지 */

        next();

    },speed);
}


/* 동물 클릭 */

function hit(index){

    if(!running||index!==current)return;

    const animal=holes[index].querySelector(".active");

    if(!animal)return;

    clearTimeout(animalTimer);

    animal.classList.remove("active");


    /* 두더지 */

    if(animal.classList.contains("mole")){

        hits++;

        combo++;

        maxCombo=Math.max(maxCombo,combo);

        const point=100+(combo-1)*10;

        score+=point;

        pop(
            holes[index],
            "+"+point
        );

    }


    /* 토끼 / 호랑이 */

    else if(animal.classList.contains("rabbit")){

        score-=100;

        combo=0;

        pop(
            holes[index],
            "-100",
            true
        );

    }

    else if(animal.classList.contains("tiger")){

        score-=150;

        combo=0;

        pop(
            holes[index],
            "-150",
            true
        );

    }

    scoreEl.textContent=score;
    comboEl.textContent=combo;

    next();
}


/* 점수 표시 */

function pop(hole,text,bad=false){

    const el=document.createElement("div");

    el.className="pop"+(bad?" bad":"");

    el.textContent=text;

    hole.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },600);

}


/* 게임 종료 */

function endGame(){

    running=false;

    clearInterval(timer);
    clearTimeout(animalTimer);

    hide();

    if(score>best){

        best=score;

        localStorage.setItem(
            "whackAMoleBest",
            best
        );

    }

    document.getElementById("finalScore").textContent=score;
    document.getElementById("hits").textContent=hits;
    document.getElementById("maxCombo").textContent=maxCombo;
    document.getElementById("best").textContent=best;


    /* 남은 게임 횟수에 따라 버튼 변경 */

    const retryButton=document.getElementById("retryButton");

    if(gameCount<MAX_GAME_COUNT){

        const remaining=MAX_GAME_COUNT-gameCount;

        retryButton.style.display="block";
        retryButton.textContent=`다시 하기 (${remaining}회 남음)`;
        retryButton.onclick=startGame;

    }else{

        /*
         * 3판 모두 완료하면
         * 다시 하기 버튼 대신 종료하기 버튼 표시
         */
        retryButton.style.display="block";
        retryButton.textContent="종료하기";
        retryButton.onclick=closeGame;

    }


    /*
     * 게임 종료 후 결과 화면 표시
     */
    document
        .getElementById("result")
        .classList.remove("hidden");
}


/* 게임 종료 */

function closeGame(){

    /*
     * 브라우저가 허용하는 경우
     * 현재 창을 닫습니다.
     *
     * 일반 브라우저 탭에서는
     * 보안 정책상 window.close()가
     * 동작하지 않을 수 있습니다.
     */
    window.close();

}

</script>

</body>
</html>
