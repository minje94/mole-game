<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>두더지 잡기 - 금융본부 미니게임 대회</title>

<style>
*{
    box-sizing:border-box
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#061321;
    font-family:Arial,"Malgun Gothic",sans-serif;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
    touch-action:manipulation;
    color:#eaf2fb
}


/* =========================
   게임 화면
   ========================= */

.game{
    width:500px;
    max-width:95vw;
    padding:25px;
    background:#0c1c2d;
    border:1px solid #19344d;
    border-radius:18px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.45)
}

h1{
    margin:0 0 15px;
    color:#f2f6fb
}

.user-badge{
    display:inline-block;
    font-size:13px;
    font-weight:bold;
    color:#6c5ce7;
    background:#edeaff;
    padding:4px 12px;
    border-radius:12px;
    margin-bottom:12px;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin-bottom:15px
}

.stat{
    font-weight:bold;
    color:#dce8f5
}

.time{
    color:#ff557f
}

.score{
    color:#4fa3ff
}

.combo{
    color:#ff9f43
}

.board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px
}

.hole{
    position:relative;
    height:120px;
    overflow:hidden;
    border-radius:50%;
    background:#6b4935;
    box-shadow:
        inset 0 8px 12px rgba(35,20,12,.55),
        0 3px 8px rgba(0,0,0,.35);
    border:2px solid #8b654b;
    cursor:pointer;
    touch-action:manipulation
}

.hole:after{
    content:"";
    position:absolute;
    left:10%;
    right:10%;
    bottom:5px;
    height:20px;
    background:#38251b;
    border-radius:50%;
    z-index:4;
    pointer-events:none
}

/* =========================
   동물
   ========================= */

.animal{
    position:absolute;
    width:80px;
    height:90px;
    left:50%;
    bottom:-110px;
    transform:translateX(-50%);
    transition:.15s;
    border-radius:45% 45% 40% 40%;
    z-index:2
}

.animal.active{
    bottom:5px
}

.eye{
    position:absolute;
    top:28px;
    width:9px;
    height:10px;
    background:#222;
    border-radius:50%;
    z-index:4
}

.eye.left{
    left:21px
}

.eye.right{
    right:21px
}

.nose{
    position:absolute;
    top:44px;
    left:50%;
    transform:translateX(-50%);
    width:13px;
    height:9px;
    background:#222;
    border-radius:50%;
    z-index:4
}


/* =========================
   두더지
   ========================= */

.mole{
    background:#8b5a3c;
    border:3px solid #65402d;
    border-radius:45% 45% 35% 35%
}

.mole .ear{
    display:none
}

.mole .eye{
    top:29px;
    width:9px;
    height:9px
}

.mole .nose{
    top:45px;
    width:14px;
    height:10px;
    background:#e88d9d
}


/* =========================
   토끼
   ========================= */

.rabbit{
    background:#f1dddd;
    border:3px solid #d2b5b5;
    border-radius:45% 45% 35% 35%
}

.rabbit .ear{
    position:absolute;
    width:16px;
    height:30px;
    top:-7px;
    background:#f1dddd;
    border:3px solid #d2b5b5;
    border-radius:50%;
    z-index:1
}

.rabbit .ear.left{
    left:12px;
    transform:rotate(-8deg)
}

.rabbit .ear.right{
    right:12px;
    transform:rotate(8deg)
}

.rabbit .ear:after{
    content:"";
    position:absolute;
    width:6px;
    height:19px;
    top:4px;
    left:2px;
    background:#e8a8b8;
    border-radius:50%
}

.rabbit .nose{
    background:#d87f98
}

.rabbit:after{
    content:"";
    position:absolute;
    left:50%;
    top:52px;
    transform:translateX(-50%);
    width:20px;
    height:13px;
    background:
        linear-gradient(
            to right,
            white 0,
            white 8px,
            transparent 8px,
            transparent 12px,
            white 12px,
            white 20px
        );
    border-radius:0 0 4px 4px;
    z-index:3
}


/* =========================
   호랑이
   ========================= */

.tiger{
    background:#e9a13b;
    border:3px solid #c47b22;
    border-radius:45% 45% 35% 35%
}

.tiger .ear{
    position:absolute;
    width:18px;
    height:18px;
    top:2px;
    background:#e9a13b;
    border:3px solid #c47b22;
    border-radius:50%;
    z-index:1
}

.tiger .ear.left{
    left:9px
}

.tiger .ear.right{
    right:9px
}

.tiger .ear:after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    left:3px;
    top:3px;
    background:#f4c47a;
    border-radius:50%
}

.tiger:before{
    content:"";
    position:absolute;
    left:12px;
    top:25px;
    width:9px;
    height:14px;
    border-left:3px solid #70451f;
    border-radius:50%;
    transform:rotate(-20deg);
    box-shadow:47px 0 0 -1px #70451f
}

.tiger:after{
    content:"";
    position:absolute;
    left:50%;
    top:52px;
    transform:translateX(-50%);
    width:13px;
    height:8px;
    background:#8b5a3c;
    border-radius:50%;
    z-index:3
}

.tiger .eye{
    width:9px;
    height:9px;
    top:29px;
    background:#3d2a1c
}

.tiger .nose{
    top:44px;
    width:11px;
    height:8px;
    background:#8b5a3c
}


/* =========================
   점수 팝업
   ========================= */

.pop{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:22px;
    font-weight:bold;
    color:#35d07f;
    animation:pop .6s forwards;
    z-index:5;
    pointer-events:none
}

.pop.bad{
    color:#ff557f
}

@keyframes pop{
    to{
        opacity:0;
        transform:translate(-50%,-40px)
    }
}


/* =========================
   버튼
   ========================= */

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    background:#2673c5;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent
}

button:hover{
    background:#2d7fd4;
    transform:translateY(-1px)
}

button:active{
    transform:scale(.98)
}


/* =========================
   시작 / 결과 화면
   ========================= */

.overlay{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(2,13,25,.88);
    z-index:100;
    padding:20px
}

.modal{
    width:420px;
    max-width:90vw;
    padding:30px 36px;
    background:
        linear-gradient(
            145deg,
            #174775 0%,
            #0b2949 100%
        );
    border:1px solid #315878;
    border-radius:17px;
    text-align:center;
    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.04)
}

.modal h2{
    margin:0 0 8px;
    color:#f4f7fb;
    font-size:25px;
    font-weight:700
}

.rules{
    padding:0;
    margin:0 0 20px;
    background:transparent;
    border-radius:0;
    line-height:1.7;
    text-align:center;
    color:#d3dfeb;
    font-size:14px
}

.result{
    font-size:45px;
    font-weight:bold;
    color:#4fa3ff;
    margin:20px
}

.hidden{
    display:none
}


/* =========================
   시작 화면 입력 요소
   ========================= */

/*
   HTML에 select / input이 있다면
   이미지와 비슷한 형태로 적용
*/

.modal select,
.modal input{
    width:100%;
    height:47px;
    padding:0 15px;
    margin-bottom:12px;
    border:1px solid #57738e;
    border-radius:9px;
    background:#203d5a;
    color:#e9f1f8;
    font-size:16px;
    outline:none
}

.modal select{
    appearance:auto;
    -webkit-appearance:auto;
    cursor:pointer
}

.modal select:focus,
.modal input:focus{
    border-color:#ff4d79;
    box-shadow:0 0 0 1px rgba(255,77,121,.2)
}

.modal input::placeholder{
    color:#8092a5
}

.modal select:disabled,
.modal input:disabled{
    opacity:.65;
    cursor:not-allowed
}


/* 선택 영역이 별도의 div로 되어 있는 경우 */

.modal .select-box{
    width:100%;
    min-height:47px;
    padding:13px 15px;
    margin-bottom:12px;
    border:1px solid #ff4d79;
    border-radius:9px;
    background:#203d5a;
    color:#e9f1f8;
    text-align:left;
    font-size:16px
}


/* 오류/안내 문구 */

.modal .error,
.modal .message,
.modal .warning{
    color:#ff4d79;
    font-size:13px;
    margin:4px 0 12px
}


/* 시작 버튼 */

.modal button{
    height:40px;
    padding:0 14px;
    margin-top:2px;
    border-radius:9px;
    background:#246fbd;
    font-size:15px;
    box-shadow:none
}

.modal button:hover{
    background:#287acb;
    transform:none
}


/* =========================
   광고 팝업
   ========================= */

.adPopup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999
}

.adBox{
    text-align:center
}

.adBox img{
    width:350px;
    max-width:90vw;
    border-radius:12px
}

#adCloseBtn{
    display:inline-block;
    margin-top:20px
}

#adCloseBtn:disabled{
    opacity:0.5;
    cursor:not-allowed;
}


/* =========================
   모바일
   ========================= */

@media (max-width:600px){

    body{
        min-height:100dvh;
        padding:10px;
        background:#061321
    }

    .game{
        width:100%;
        max-width:500px;
        padding:18px;
        border-radius:16px
    }

    h1{
        font-size:25px;
        margin-bottom:12px
    }

    .stats{
        margin-bottom:12px;
        font-size:14px
    }

    .board{
        gap:10px;
        margin-bottom:15px
    }

    .hole{
        height:100px
    }

    .animal{
        width:68px;
        height:78px;
        bottom:-95px
    }

    .animal.active{
        bottom:4px
    }

    .eye{
        top:24px;
        width:8px;
        height:9px
    }

    .eye.left{
        left:18px
    }

    .eye.right{
        right:18px
    }

    .nose{
        top:39px;
        width:12px;
        height:8px
    }

    .mole .eye{
        top:25px
    }

    .mole .nose{
        top:40px;
        width:13px;
        height:9px
    }

    .rabbit .ear{
        width:14px;
        height:27px
    }

    .rabbit .ear.left{
        left:10px
    }

    .rabbit .ear.right{
        right:10px
    }

    .rabbit:after{
        top:46px;
        width:18px;
        height:12px
    }

    .tiger .ear{
        width:16px;
        height:16px
    }

    .tiger .ear.left{
        left:8px
    }

    .tiger .ear.right{
        right:8px
    }

    .tiger:before{
        left:10px;
        top:22px;
        box-shadow:40px 0 0 -1px #70451f
    }

    .tiger:after{
        top:46px
    }

    .tiger .eye{
        top:25px
    }

    .tiger .nose{
        top:39px
    }

    button{
        padding:13px;
        font-size:17px
    }

    .modal{
        width:420px;
        max-width:calc(100vw - 32px);
        padding:25px 20px;
        border-radius:16px
    }

    .modal h2{
        font-size:23px;
        margin-bottom:8px
    }

    .rules{
        padding:0;
        margin:0 0 18px;
        font-size:14px;
        line-height:1.7
    }

    .result{
        font-size:38px;
        margin:15px
    }

    .modal select,
    .modal input{
        height:46px;
        font-size:15px
    }

    .modal button{
        height:40px;
        font-size:15px
    }
}


/* =========================
   아주 작은 화면
   ========================= */

@media (max-width:380px){

    .game{
        padding:14px
    }

    h1{
        font-size:22px
    }

    .stats{
        font-size:13px
    }

    .board{
        gap:7px
    }

    .hole{
        height:85px
    }

    .animal{
        width:60px;
        height:70px;
        bottom:-85px
    }

    .animal.active{
        bottom:3px
    }

    .modal{
        padding:22px 17px
    }

    .modal h2{
        font-size:21px
    }

    .rules{
        font-size:13px
    }
}
</style>

</head>

<body>

<!-- 시작 화면 -->

<div class="overlay" id="start">

<div class="modal">

    <h2>🐹 두더지 잡기</h2>

    <div class="rules">
        ⏱ 게임 시간 : <b>20초</b><br>
        🐹 두더지 : <b>+10점</b> (연속 성공 시 콤보 가산)<br>
        🐰 토끼 : <b>-30점</b> / 🐯 호랑이 : <b>-50점</b><br>
        ⚠️ 다른 동물을 클릭하면 콤보 초기화
    </div>

    <div class="input-box">
        <div>
            <select id="teamSelect" class="input-control">
            	<option value="">소속 팀을 선택하세요.</option>
                <option value="증권개발팀">증권개발팀</option>
                <option value="증권채널팀">증권채널팀</option>
                <option value="카드개발팀">카드개발팀</option>
                <option value="라이프개발팀">라이프개발팀</option>                    
	    	<option value="기타">기타</option>
            </select>
        </div>
        <div>
            <input type="text" id="sabunInput" class="input-control" placeholder="DS 사번을 입력하세요." maxlength="10">
        </div>
    </div>

    <button onclick="handleInitialStart()"> 대회 참가 및 시작</button>

</div>

</div>


<!-- 게임 화면 -->

<div class="game" id="gameScreen">

<h1>🐹 두더지 잡기</h1>

<div id="userBadge" class="user-badge" style="display:none;"></div>	
<div class="stats">

<div class="stat time">
    ⏱ <span id="time">20</span>초
</div>

<div class="stat score">
    점수 <span id="score">0</span>
</div>

<div class="stat combo">
    콤보 <span id="combo">0</span>
</div>

</div>

<div class="board" id="board"></div>

</div>


<!-- 결과 화면 -->

<div class="overlay hidden" id="result">

<div class="modal">

    <h2>🎉 게임 종료!</h2>

    <div class="result" id="finalScore">0</div>

    <div>
        잡은 두더지 : <b id="hits">0</b>마리<br>
        최대 콤보 : <b id="maxCombo">0</b><br>
        최고 점수 : <b id="best">0</b>
    </div>

    <br>

    <!-- 게임 중에는 숨겨져 있고 게임 종료 후 표시 -->
    <button id="retryButton" style="display:none">다시 하기</button>

</div>

</div>

<script>
// 배포된 구글 스프레드시트 웹 앱 URL 및 식별자
const GOOGLE_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyY6mM4y9ltyZhDn7fMCctYajEBye1sxZpQrQ-FcabhllionztMTlJEJMCKCDy_ZxCOMg/exec";
const GAME_NAME = "두더지잡기";

const GAME_TIME=20;

const MOLE_COUNT=14;
const RABBIT_COUNT=4;
const TIGER_COUNT=4;

let userTeam = "";
let userSabun = "";

const board=document.getElementById("board");
const timeEl=document.getElementById("time");
const scoreEl=document.getElementById("score");
const comboEl=document.getElementById("combo");
const userBadge = document.getElementById("userBadge");

let score=0;
let combo=0;
let maxCombo=0;
let hits=0;
let time=GAME_TIME;
let gameCount = 0;

let current=-1;
let running=false;

let moleSpawned=0;
let rabbitSpawned=0;
let tigerSpawned=0;

/* 콘솔용 전체 동물 등장 횟수 */
let spawnCount=0;

let spawnTimers=[];

let timer;
let animalTimer;

let best=Number(localStorage.getItem("whackAMoleBest"))||0;

document.getElementById("best").textContent=best;


// 구글 시트 로그 비동기 전송
function sendLog(eventType, extraData = {}) {
    if (!GOOGLE_WEBHOOK_URL) return;
    const payload = Object.assign({
        game: GAME_NAME,
        team: userTeam,
        sabun: userSabun,
        event: eventType,
        level: `${gameCount}회차`
    }, extraData);

    fetch(GOOGLE_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    }).catch(err => console.warn("로그 전송 실패:", err));
}

/* 9개 구멍 생성 */

for(let i=0;i<9;i++){

    const hole=document.createElement("div");

    hole.className="hole";

    ["mole","rabbit","tiger"].forEach(type=>{

        hole.innerHTML+=`
            <div class="animal ${type}">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="nose"></div>
            </div>
        `;

    });

    /* 모바일 터치 및 PC 클릭 모두 지원 */
    hole.addEventListener("click",()=>hit(i));

    board.appendChild(hole);
}

const holes=document.querySelectorAll(".hole");

// 팀 & 사번 유효성 체크 후 최초 시작
function handleInitialStart() {
    const team = document.getElementById("teamSelect").value;
    const sabun = document.getElementById("sabunInput").value.trim();

    if (!team) {
        alert("소속 팀을 선택해 주세요.");
        return;
    }
    if (!sabun) {
        alert("사번을 입력해 주세요.");
        return;
    }

    userTeam = team;
    userSabun = sabun;

    userBadge.textContent = `[${userTeam}] 사번: ${userSabun}`;
    userBadge.style.display = "inline-block";

    startGame();
}

/* 게임 시작 */

function startGame(){

    gameCount++;
    clearInterval(timer);
    clearTimeout(animalTimer);

    score=0;
    combo=0;
    maxCombo=0;
    hits=0;
    time=GAME_TIME;

    current=-1;
    running=true;

    moleSpawned=0;
    rabbitSpawned=0;
    tigerSpawned=0;
    spawnCount=0;

    timeEl.textContent=time;
    scoreEl.textContent=score;
    comboEl.textContent=combo;

    /*
     * 시작 화면 숨기기
     * 결과 화면도 숨기기
     */
    document.getElementById("start").classList.add("hidden");
    document.getElementById("result").classList.add("hidden");

    /*
     * 게임 시작 시 결과 화면의
     * 다시 하기 버튼은 숨김
     */
    document.getElementById("retryButton").style.display="none";

    hide();

    timer=setInterval(()=>{

        timeEl.textContent=--time;

        if(time<=0){
            endGame();
        }

    },1000);

    
scheduleSpawns();

}


function scheduleSpawns(){

    spawnTimers.forEach(t=>clearTimeout(t));
    spawnTimers=[];

    function randomTimes(count){
        const arr=[];
        for(let i=0;i<count;i++){
            arr.push(500+Math.random()*18500);
        }
        return arr.sort((a,b)=>a-b);
    }

    randomTimes(MOLE_COUNT).forEach(t=>{
        spawnTimers.push(setTimeout(()=>spawnAnimal("mole"),t));
    });

    randomTimes(RABBIT_COUNT).forEach(t=>{
        spawnTimers.push(setTimeout(()=>spawnAnimal("rabbit"),t));
    });

    randomTimes(TIGER_COUNT).forEach(t=>{
        spawnTimers.push(setTimeout(()=>spawnAnimal("tiger"),t));
    });
}

function spawnAnimal(type){

    if(!running)return;

    /* 현재 화면에 보이는 동물 수 */
    const activeCount=
        document.querySelectorAll(".animal.active").length;

    /* 동시에 최대 2마리까지만 표시 */
    if(activeCount>=2){

        setTimeout(()=>{
            if(running){
                spawnAnimal(type);
            }
        },300);

        return;
    }

    /* 활성 동물이 없는 구멍을 우선 선택 */
    const availableHoles=[];

    holes.forEach((hole,index)=>{
        if(!hole.querySelector(".animal.active")){
            availableHoles.push(index);
        }
    });

    if(availableHoles.length===0){
        setTimeout(()=>{
            if(running){
                spawnAnimal(type);
            }
        },300);

        return;
    }

    const index=
        availableHoles[Math.floor(Math.random()*availableHoles.length)];

    const animal=holes[index].querySelector("." + type);

    animal.classList.add("active");

    /* 실제 등장 횟수 기록 */
    spawnCount++;

    const animalName={
        mole:"두더지",
        rabbit:"토끼",
        tiger:"호랑이"
    }[type] || type;

    console.log(
        `[동물 등장] ${spawnCount}번째 / ${animalName}`
    );

    setTimeout(()=>{
        animal.classList.remove("active");
    },900);
}

/* 모든 동물 숨기기 */

function hide(){

    document
        .querySelectorAll(".animal")
        .forEach(a=>a.classList.remove("active"));

}

/* 동물 클릭 */

function hit(index){

    if(!running)return;

    const animal=holes[index].querySelector(".active");

    if(!animal)return;

    clearTimeout(animalTimer);

    animal.classList.remove("active");


    /* 두더지 */

    if(animal.classList.contains("mole")){

        hits++;

        combo++;

        maxCombo=Math.max(maxCombo,combo);

        const point=10+(combo-1)*10;

        score+=point;

        pop(
            holes[index],
            "+"+point
        );

    }


    /* 토끼 / 호랑이 */

    else if(animal.classList.contains("rabbit")){

        score-=30;

        combo=0;

        pop(
            holes[index],
            "-30",
            true
        );

    }

    else if(animal.classList.contains("tiger")){

        score-=50;

        combo=0;

        pop(
            holes[index],
            "-50",
            true
        );

    }

    scoreEl.textContent=score;
    comboEl.textContent=combo;
}


/* 점수 표시 */

function pop(hole,text,bad=false){

    const el=document.createElement("div");

    el.className="pop"+(bad?" bad":"");

    el.textContent=text;

    hole.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },600);

}


/* 게임 종료 */

function endGame(){

    running=false;

    clearInterval(timer);
    clearTimeout(animalTimer);

    hide();

    if(score>best){

        best=score;

        localStorage.setItem(
            "whackAMoleBest",
            best
        );

    }

    document.getElementById("finalScore").textContent=score;
    document.getElementById("hits").textContent=hits;
    document.getElementById("maxCombo").textContent=maxCombo;
    document.getElementById("best").textContent=best;
    
    // 종료 로그 전송
    sendLog("종료", {
        score: score,
        detail: `잡은수: ${hits}마리, 최대콤보: ${maxCombo}`
    });

    const retryButton=document.getElementById("retryButton");

    retryButton.style.display="block";
    retryButton.textContent="다시 하기";
    retryButton.onclick=showAdPopup;
	
    /*
     * 게임 종료 후 결과 화면 표시
     */
    document
        .getElementById("result")
        .classList.remove("hidden");
}


function showAdPopup(){
    const popup = document.getElementById("adPopup");
    const closeBtn = document.getElementById("adCloseBtn");

    popup.style.display="flex";

    // 닫기 버튼은 처음부터 보이지만 비활성화
    closeBtn.style.display="inline-block";
    closeBtn.disabled=true;

    let count=3;
    closeBtn.textContent=`닫기 (${count})`;

    const countdown=setInterval(()=>{
        count--;

        if(count>0){
            closeBtn.textContent=`닫기 (${count})`;
        }else{
            clearInterval(countdown);

            // 3, 2, 1 종료 후 버튼 활성화
            closeBtn.disabled=false;
            closeBtn.textContent="닫기";
        }
    },1000);

    closeBtn.onclick=()=>{
        if(closeBtn.disabled) return;

        popup.style.display="none";
        startGame();
    };
}


</script>

<div class="adPopup" id="adPopup">

    <div class="adBox">

        <img
            src="test.jpg"
            alt="신한DS 10대 업무수칙"
        >

        <br>

        <button id="adCloseBtn">
            닫기
        </button>

    </div>

</div>
